  .comment-pop{ animation: popIn .45s cubic-bezier(.2,.8,.3,1.2) forwards; }

  }

  .terminal-line{ opacity:1; transform: scaleY(.02); }
  .terminal-open{ opacity:1; transform: scaleY(1); }

  .progress-bar{

const { useState, useEffect, useRef, useCallback } = React;

const NAV_ITEMS = [
  { id: "beranda", label: "Beranda" },
  { id: "tentang", label: "Tentang Saya" },
  { id: "skill", label: "Skill" },
  { id: "project", label: "Project" },
  { id: "komentar", label: "Komentar" },
  { id: "kontak", label: "Kontak" },
];

function Reveal({ children, className = "", delay = 0, mode = "toggle", y = 10 }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setInView(true);
          if (mode === "once") obs.unobserve(el);
        } else if (mode === "toggle") {
          setInView(false);
        }
      },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, [mode]);

  return (
    <div
      ref={ref}
      style={{ transitionDelay: `${delay}ms` }}
      className={`transition-all duration-700 ease-out ${
        inView ? "opacity-100 translate-y-0" : `opacity-0 translate-y-${y}`
      } ${className}`}
    >
      {children}
    </div>
  );
}

function ScrollProgress() {
  const [width, setWidth] = useState(0);
  useEffect(() => {
    function onScroll() {
      const h = document.documentElement;
      const scrolled = h.scrollTop;
      const max = h.scrollHeight - h.clientHeight;
      setWidth(max > 0 ? (scrolled / max) * 100 : 0);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return <div className="progress-bar bg-[#FFD400] border-r-2 border-black" style={{ width: `${width}%` }}></div>;
}

function BackToTop() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    function onScroll() { setShow(window.scrollY > 500); }
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  if (!show) return null;
  return (
    <a
      href="#beranda"
      className="fixed bottom-6 right-6 z-50 w-12 h-12 flex items-center justify-center bg-[#FFD400] border-2 border-black font-mono font-bold brutal-press brutal-shadow-sm"

      ↑
    </a>
  );
}

      { rootMargin: "-45% 0px -45% 0px", threshold: 0 }

function useTypedLines(lines, speed = 55, startDelay = 250) {
  const [output, setOutput] = useState(lines.map(() => ""));
  const [lineIndex, setLineIndex] = useState(0);
  const [charIndex, setCharIndex] = useState(0);
  const [started, setStarted] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setStarted(true), startDelay);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (!started || lineIndex >= lines.length) return;
    if (charIndex > lines[lineIndex].length) {
      const t = setTimeout(() => { setLineIndex((li) => li + 1); setCharIndex(0); }, 220);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => {
      setOutput((prev) => {
        const next = [...prev];
        next[lineIndex] = lines[lineIndex].slice(0, charIndex);
        return next;
      });
      setCharIndex((c) => c + 1);
    }, speed);
    return () => clearTimeout(t);
  }, [started, lineIndex, charIndex]);

  return { output, lineIndex, done: lineIndex >= lines.length };
}

function Terminal({ start }) {
  const [stage, setStage] = useState("hidden");
  const lines = [
    { prompt: "akmal@its:~$", cmd: "whoami" },
    { out: "mahasiswa_teknik_komputer_its" },
    { prompt: "akmal@its:~$", cmd: "cat fokus.txt" },
    { out: "Python, Cybersecurity, AI Automation" },
    { prompt: "akmal@its:~$", cmd: "cat target.txt" },
    { out: "IPK 3.75+ | Cum Laude 🎯" },
    { prompt: "akmal@its:~$", cmd: "_" },
  ];
  const [visible, setVisible] = useState(0);

  useEffect(() => {
    if (!start) return;
    const t1 = setTimeout(() => setStage("line"), 100);
    const t2 = setTimeout(() => setStage("open"), 350);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [start]);

  useEffect(() => {
    if (stage !== "open") return;
    if (visible >= lines.length) return;
    const t = setTimeout(() => setVisible(visible + 1), 480);
    return () => clearTimeout(t);
  }, [stage, visible]);

  const stageClass = stage === "hidden" ? "terminal-hidden" : stage === "line" ? "terminal-line" : "terminal-open";

  return (
    <div className={`terminal-box ${stageClass} bg-black border-4 border-black brutal-shadow w-full max-w-md`}>
      <div className="flex items-center gap-2 px-4 py-2.5 border-b-2 border-[#333]">
        <span className="w-3 h-3 rounded-full bg-[#FF5F56] inline-block"></span>
        <span className="w-3 h-3 rounded-full bg-[#FFBD2E] inline-block"></span>
        <span className="w-3 h-3 rounded-full bg-[#27C93F] inline-block"></span>
        <span className="ml-2 font-mono text-[11px] text-[#888]">terminal — akmal</span>
      </div>
      <div className="p-5 font-mono text-sm leading-relaxed min-h-[220px]">
        {lines.slice(0, visible).map((l, i) =>
          l.cmd ? (
            <div key={i} className="text-[#B4FF3D]">
              <span className="text-[#2F6FF0]">{l.prompt}</span> {l.cmd}
            </div>
          ) : (
            <div key={i} className="text-white pl-1">{l.out}</div>
          )
        )}
        {stage === "open" && visible < lines.length && <span className="text-[#B4FF3D] blink">▊</span>}
      </div>
    </div>
  );
}

function SkillCard({ name, level, note, color }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  const [count, setCount] = useState(0);
  const colorMap = { yellow: "bg-[#FFD400]", pink: "bg-[#FF3EA5]", blue: "bg-[#2F6FF0]", lime: "bg-[#B4FF3D]" };

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => setInView(entry.isIntersecting),
      { threshold: 0.25 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  useEffect(() => {
    if (!inView) { setCount(0); return; }
    let raf;
    const startTime = performance.now();
    const duration = 700;
    function tick(now) {
      const p = Math.min((now - startTime) / duration, 1);
      setCount(Math.round(p * level));
      if (p < 1) raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [inView, level]);

  return (
    <div
      ref={ref}
      className={`skill-card border-2 border-black bg-white p-4 brutal-shadow-sm transition-all duration-700 ease-out ${
        inView ? "opacity-100 translate-y-0" : "opacity-0 translate-y-10"
      }`}
    >
      <div className="flex justify-between items-baseline mb-2">
        <span className="font-display font-700 text-base">{name}</span>
        <span className="font-mono text-sm font-bold">{count}%</span>
      </div>
      <div className="h-4 border-2 border-black bg-[#F7F7F2] overflow-hidden">
        <div
          className={`${colorMap[color]} h-full border-r-2 border-black transition-all duration-700 ease-out`}
          style={{ width: `${inView ? level : 0}%` }}
        ></div>
      </div>
      <div className="font-mono text-[11px] font-bold text-[#555] mt-2">{note}</div>
    </div>
  );
}

function ProjectCard({ title, desc, tags, status, image }) {

const COMMENTS_KEY = "akmal-portfolio-comments";
const DEFAULT_COMMENTS = [
  { id: "seed-1", name: "Budi", msg: "Terminal di hero section itu keren banget, kena banget vibe-nya!", color: "yellow", rot: "-1deg" },
  { id: "seed-2", name: "Sari", msg: "Semangat kuliahnya, semoga cum laude ya!", color: "pink", rot: "1.5deg" },
];

function loadComments() {
  try {
    const raw = localStorage.getItem(COMMENTS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return DEFAULT_COMMENTS;
}

function Komentar() {
  const [comments, setComments] = useState(loadComments);
  const [name, setName] = useState("");
  const [msg, setMsg] = useState("");
  const [storageOk, setStorageOk] = useState(true);
  const colors = ["yellow", "pink", "blue", "lime"];

  useEffect(() => {
    try {
      localStorage.setItem(COMMENTS_KEY, JSON.stringify(comments));
    } catch (e) {
      setStorageOk(false);
    }
  }, [comments]);

  const bgMap = {
    yellow: "bg-[#FFD400]",
    pink: "bg-[#FF3EA5] text-white",
    blue: "bg-[#2F6FF0] text-white",
    lime: "bg-[#B4FF3D]",
  };

  function submit(e) {
    e.preventDefault();
    if (!name.trim() || !msg.trim()) return;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const rot = `${(Math.random() * 4 - 2).toFixed(1)}deg`;
    const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `c-${Date.now()}`;
    setComments([{ id, name, msg, color, rot }, ...comments]);
    setName("");
    setMsg("");
  }

  function remove(id) {
    setComments(comments.filter((c) => c.id !== id));
  }

  return (
    <section id="komentar" className="border-b-4 border-black bg-[#2F6FF0] dots-bg">
      <div className="max-w-6xl mx-auto px-5 md:px-8 py-20 md:py-24">
        <Reveal mode="once"><Badge color="yellow">LAMAN KOMENTAR</Badge></Reveal>
        <Reveal mode="once" delay={80}>
          <h2 className="font-display font-800 text-3xl md:text-4xl mt-4 mb-3 text-white">Tinggalkan pesan.</h2>
        </Reveal>
        

        <Reveal mode="once" delay={220}>
          <form onSubmit={submit} className="bg-white border-4 border-black brutal-shadow p-6 mb-12 max-w-xl">
            <label className="block font-mono text-xs font-bold mb-1.5">NAMA</label>
            <input
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="Nama kamu"
              className="w-full border-2 border-black px-3 py-2 mb-4 font-medium focus:outline-none focus:bg-[#FFD400]/30"
            />
            <label className="block font-mono text-xs font-bold mb-1.5">PESAN</label>
            <textarea
              value={msg}
              onChange={(e) => setMsg(e.target.value)}
              placeholder="Tulis komentar..."
              rows="3"
              className="w-full border-2 border-black px-3 py-2 mb-4 font-medium focus:outline-none focus:bg-[#FFD400]/30"
            />
            <button type="submit" className="brutal-press brutal-shadow-sm bg-black text-white font-mono font-bold px-6 py-2.5 border-2 border-black">
              Kirim Komentar
            </button>
          </form>
        </Reveal>

        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
          {comments.map((c) => (
            <div
              key={c.id}
              style={{ transform: `rotate(${c.rot})` }}
              className={`comment-pop relative ${bgMap[c.color]} border-4 border-black brutal-shadow-sm p-5`}
            >
              <button
                onClick={() => remove(c.id)}
                aria-label="Hapus komentar"
                className="absolute top-2 right-2 w-6 h-6 flex items-center justify-center bg-black text-white font-mono text-xs font-bold border-2 border-black brutal-press"
              >
                ✕
              </button>
              <p className="font-medium text-sm leading-relaxed mb-3 pr-6">"{c.msg}"</p>
              <p className="font-mono text-xs font-bold">— {c.name}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Kontak() {
  const [copied, setCopied] = useState(false);
  const channels = [
    { label: "Email", value: "akmal@email.com", color: "yellow", icon: "✉" },
    { label: "GitHub", value: "github.com/akmal", color: "pink", icon: "⌥" },
    { label: "LinkedIn", value: "linkedin.com/in/akmal", color: "blue", icon: "in" },
    { label: "Instagram", value: "@akmal", color: "lime", icon: "◎" },
  ];

  function copyEmail() {
    const email = channels[0].value;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(email).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      });
    }
  }

  const chipColor = {
    yellow: "bg-[#FFD400]", pink: "bg-[#FF3EA5]", blue: "bg-[#2F6FF0]", lime: "bg-[#B4FF3D]",
  };

  return (
    <section id="kontak" className="bg-black text-white">
      <div className="max-w-6xl mx-auto px-5 md:px-8 py-20 md:py-24">
        <Reveal mode="once"><Badge color="yellow">KONTAK</Badge></Reveal>
        <Reveal mode="once" delay={80}>
          <h2 className="font-display font-800 text-3xl md:text-4xl mt-4 mb-3">Mari terhubung.</h2>
        </Reveal>
        <Reveal mode="once" delay={140}>
          <p className="text-white/70 max-w-lg mb-10">
            Klik kartu email untuk menyalinnya, atau langsung sapa lewat kanal favoritmu.
          </p>
        </Reveal>

        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
          {channels.map((c, i) => (
            <Reveal key={c.label} mode="once" delay={180 + i * 90}>
              <button
                onClick={c.label === "Email" ? copyEmail : undefined}
                className="contact-card w-full text-left border-2 border-white p-5 bg-black brutal-shadow-sm"
              >
                <div className={`w-9 h-9 flex items-center justify-center font-mono font-bold text-black mb-4 ${chipColor[c.color]} border-2 border-white`}>
                  {c.icon}
                </div>
                <div className="font-mono text-[10px] font-bold text-white/60 uppercase mb-1">{c.label}</div>
                <div className="font-display font-700 text-sm break-all">{c.value}</div>
                {c.label === "Email" && (
                  <div className="font-mono text-[10px] text-[#B4FF3D] mt-2 h-3">{copied ? "Disalin!" : ""}</div>
                )}
              </button>
            </Reveal>
          ))}
        </div>
        <p className="font-mono text-[11px] text-white/40 mt-4">*Ganti dengan kontak asli kamu ya.</p>

        <div className="mt-16 pt-6 border-t-2 border-white/20 flex flex-col sm:flex-row justify-between gap-2 font-mono text-xs text-white/50">
          <span>© 2026 Akmal. Dibangun dengan React + Tailwind.</span>
          <span>Neo-brutalism, on purpose.</span>
        </div>
      </div>
    </section>
  );
}

function App() {
  return (
    <div>
      <ScrollProgress />
      <Nav />
      <Hero />
      <Tentang />
      <Skill />
      <Project />
      <Komentar />
      <Kontak />
      <BackToTop />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
